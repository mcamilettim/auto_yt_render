name: bench
on:
  workflow_dispatch:
    inputs:
      fast:
        type: choice
        options: ["1", "0"]
        default: "1"
      frames:
        default: "48"
      orient:
        type: choice
        options: [vertical, horizontal]
        default: vertical

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends blender xvfb xauth libegl1 libgl1-mesa-dri fonts-dejavu-core ffmpeg
      - run: blender --version | head -1 && nproc && free -g
      - name: Bench
        env:
          FAST: ${{ inputs.fast }}
          FRAMES: ${{ inputs.frames }}
          ORIENT: ${{ inputs.orient }}
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" blender -b -P bench/bench_anim.py > bench.log 2>&1 || true
          grep -E "BENCH|Error|Traceback" bench.log || tail -40 bench.log
          grep BENCH bench.log >> "$GITHUB_STEP_SUMMARY" || echo "SIN RESULTADO, ver bench.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Video de muestra
        run: |
          for d in bench/out/*/; do
            ffmpeg -y -loglevel error -framerate 24 -i "$d%04d.png" -c:v libx264 -pix_fmt yuv420p "${d%/}.mp4"
          done
          ls -la bench/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.run_id }}
          path: |
            bench/out/*.mp4
            bench.log
          retention-days: 7
