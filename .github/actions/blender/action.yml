name: Instalar Blender LTS
description: Instala Blender LTS oficial (Eevee Next) y las dependencias para render sin pantalla.
inputs:
  version:
    description: Serie de Blender
    default: "4.5"
runs:
  using: composite
  steps:
    - name: Cache Blender
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/blender
        key: blender-${{ inputs.version }}-linux-x64-v1
    - name: Dependencias del sistema
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libgl1-mesa-dri fonts-dejavu-core ffmpeg \
          libxi6 libxxf86vm1 libxfixes3 libxrender1 libsm6 libxkbcommon0 libx11-6 libxext6
    - name: Descargar Blender
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        V=${{ inputs.version }}
        ARCHIVO=$(curl -s "https://download.blender.org/release/Blender$V/" | grep -o "blender-$V\.[0-9]*-linux-x64\.tar\.xz" | sort -uV | tail -1)
        echo "Descargando $ARCHIVO"
        curl -sSL -o blender.tar.xz "https://download.blender.org/release/Blender$V/$ARCHIVO"
        mkdir -p "$HOME/blender" && tar -xf blender.tar.xz -C "$HOME/blender" --strip-components=1 && rm blender.tar.xz
    - shell: bash
      run: |
        echo "BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"
        "$HOME/blender/blender" --version | head -1
